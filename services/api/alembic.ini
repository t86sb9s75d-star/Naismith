# Alembic configuration for the Naismith API.
#
# The database URL is NOT set here (no secrets, no environment coupling in
# source). env.py resolves it from the alembic -x url=... option, then
# DATABASE_URL, then a local SQLite default. Migrations are the deployment
# mechanism for schema; Database.create_all() covers zero-config local/dev.

[alembic]
script_location = %(here)s/src/naismith_api/migrations
prepend_sys_path = src
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
