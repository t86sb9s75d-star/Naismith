[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "naismith-api"
version = "0.1.0"
description = "Naismith API + session gateway (Phase 0/1 vertical slice)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.30",
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
]

[project.scripts]
naismith-api = "naismith_api.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/naismith_api"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
