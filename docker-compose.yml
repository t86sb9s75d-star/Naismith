# Local development stack for the Phase 0/1 slice.
#
# The API now uses Postgres as its system of record via DATABASE_URL (sessions,
# turns, audit events, model-call cost). Redis is provisioned for the ephemeral
# session/runtime state that lands in a later slice but is not wired in yet.
# `docker compose up` is the one command a contributor needs. No real secrets
# appear here; everything uses throwaway local development values.

services:
  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    environment:
      NAISMITH_ENV: development
      NAISMITH_CORS_ORIGINS: http://localhost:5173
      # System of record for the API (SQLAlchemy). Run migrations with
      # `alembic upgrade head` (DATABASE_URL is read by env.py).
      DATABASE_URL: postgresql+psycopg://naismith:naismith@postgres:5432/naismith
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: naismith
      POSTGRES_PASSWORD: naismith
      POSTGRES_DB: naismith
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U naismith"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
